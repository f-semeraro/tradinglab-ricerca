name: laboratorio

# Un giro all'ora: scarica le candele chiuse, fa avanzare le strategie, salva i risultati.
# Nessuna chiave: gli endpoint di Kraken usati sono pubblici.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# Due giri non si sovrappongono mai: se uno è in corso, il successivo aspetta.
# Non si annulla mai un giro a metà, perché lascerebbe lo stato a metà.
concurrency:
  group: laboratorio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Un giro del laboratorio
        run: node scripts/giro.js

      - name: Salva i risultati, lo storico delle domeniche e la pagina per moneta, solo se sono cambiati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risultati dati/settimanali
          # la pagina per moneta del portafoglio esiste solo dopo l'attivazione: senza il file, git add fallirebbe
          if [ -f report/b-portafoglio-monete.md ]; then git add report/b-portafoglio-monete.md; fi
          # la storia giornaliera della variante esiste solo dopo la sua costruzione alla partenza: vale la stessa regola
          if [ -d dati/giornaliere ]; then git add dati/giornaliere; fi
          if git diff --cached --quiet; then
            echo "Nessuna novità: niente commit."
          else
            git commit -m "risultati: giro del $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --quiet
            git push
          fi

  # La pagina pubblica, da risultati/ e dati/ appena salvati, su GitHub Pages: non si committa.
  # È un job a parte, che parte anche se il giro è fallito (la pagina deve poter dire che è fermo).
  # Se non si genera o non si pubblica, il giro e il commit dei risultati sono già fatti e restano validi:
  # continue-on-error tiene il workflow verde, e l'errore resta visibile in questo job.
  pagina:
    needs: giro
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # i risultati appena committati dal giro, non il commit che ha fatto partire il workflow

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genera la pagina
        run: node scripts/dashboard.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica su GitHub Pages
        id: pubblicazione
        uses: actions/deploy-pages@v4
